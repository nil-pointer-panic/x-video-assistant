<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>X Video Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.593-6.644 7.593H.47l8.6-9.83L0 1.153h7.594l5.243 6.932 6.064-6.932Zm-1.29 19.49h2.04L6.48 3.24H4.29l13.32 17.403Z"/></svg>
      </div>
      <div class="app-name"><h1 data-i18n="name">X 视频助手</h1><div class="app-desc" data-i18n="tagline">放大播放 · 自选画质 · 批量保存</div></div>
      <details class="more-settings" id="moreSettings">
        <summary data-i18n-aria="settings" data-i18n-title="settings" aria-label="偏好设置" title="偏好设置"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a2 2 0 0 1 1.8 1.1l.3.6a2 2 0 0 0 2.4.9l.6-.2a2 2 0 0 1 2.5 1.3l.2.5a2 2 0 0 1-.6 2.3l-.5.4a2 2 0 0 0 0 2.6l.5.4a2 2 0 0 1 .6 2.3l-.2.5a2 2 0 0 1-2.5 1.3l-.6-.2a2 2 0 0 0-2.4.9l-.3.6a2 2 0 0 1-3.6 0l-.3-.6a2 2 0 0 0-2.4-.9l-.6.2a2 2 0 0 1-2.5-1.3l-.2-.5a2 2 0 0 1 .6-2.3l.5-.4a2 2 0 0 0 0-2.6l-.5-.4a2 2 0 0 1-.6-2.3l.2-.5a2 2 0 0 1 2.5-1.3l.6.2a2 2 0 0 0 2.4-.9l.3-.6A2 2 0 0 1 12 3.5Z"/><circle cx="12" cy="12" r="2.6"/></svg></summary>
        <div class="settings-flyout">
          <label for="languagePreference" data-i18n="language">界面语言</label>
          <select id="languagePreference" data-i18n-aria="language" aria-label="界面语言"></select>
          <p data-i18n="languageHelp">仅影响插件界面，不影响视频内容。</p>
        </div>
      </details>
      <span class="version">v1.6.0</span>
    </header>

    <section class="settings" aria-labelledby="setting-title">
      <div class="section-heading"><label id="setting-title" for="defaultQuality" data-i18n="qualityDefault">默认清晰度</label><span class="subtle" data-i18n="qualityRemember">自动记住设置</span></div>
      <div class="select-wrap">
        <select id="defaultQuality" aria-label="默认下载清晰度"></select>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <p id="prefState" class="helper" role="status" data-i18n="defaultHint">默认优先 480P，也可以随时更改。</p>
    </section>

    <div class="rule"></div>

    <section class="actions" data-i18n-aria="downloads" aria-label="下载视频">
      <h2 data-i18n="downloads">下载视频</h2>
      <button id="sniff" class="button-primary" type="button">
        <span class="button-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5M8 11h6"/></svg></span>
        <span data-i18n="sniff">嗅探当前页面</span>
        <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
      </button>
      <details id="otherModes" open>
        <summary data-i18n="otherWays">其他下载方式</summary>
        <button id="current" class="button-secondary" type="button" data-i18n="currentPost">解析当前帖子的视频</button>
        <div class="or-label" data-i18n="orUrl">或粘贴推文链接</div>
        <div class="url-row">
          <input id="url" type="url" placeholder="https://x.com/.../status/..." autocomplete="off" spellcheck="false" aria-label="Post URL">
          <button id="search" class="button-icon-only" type="button" data-i18n-aria="parseLink" data-i18n-title="parseLink" aria-label="解析链接" title="解析链接">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </details>
    </section>

    <div id="result" aria-live="polite"></div>
    <footer><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"/></svg><span data-i18n="footer">原始 MP4 · 自选画质</span></footer>
  </main>
  <script src="i18n.js"></script><script src="quality.js"></script><script src="popup.js"></script>
</body>
</html>
